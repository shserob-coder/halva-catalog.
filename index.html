<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HALVA CATALOG</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
header{background:#252525;color:white;padding:18px;text-align:center}
header h1{margin:0;font-size:25px;letter-spacing:2px}
header p{margin:7px 0 0;color:#ddd}
.container{max-width:900px;margin:auto;padding:15px}
button{border:0;border-radius:7px;padding:10px 14px;cursor:pointer;font-size:15px}
.admin-btn{background:#444;color:white}
.search{width:100%;padding:13px;border:1px solid #ccc;border-radius:8px;margin:15px 0;font-size:16px}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.card{background:white;border-radius:10px;padding:10px;box-shadow:0 2px 7px #ddd}
.card img{width:100%;height:145px;object-fit:cover;border-radius:7px;background:#eee}
.card h3{font-size:16px;margin:9px 0}
.price{font-weight:bold;color:#16834b;font-size:18px}
.add{background:#16834b;color:white;width:100%;margin-top:9px}
.cart{background:white;margin-top:20px;padding:15px;border-radius:10px}
.cart h2{margin-top:0}
.cart-row{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid #eee;padding:10px 0}
.qty button{padding:5px 10px;background:#eee}
.total{font-size:22px;font-weight:bold;margin:15px 0}
.whatsapp{background:#168b4c;color:white;width:100%;font-size:17px}
.panel{display:none;background:white;padding:15px;margin-top:20px;border-radius:10px}
.panel input{width:100%;padding:11px;margin:6px 0 12px;border:1px solid #ccc;border-radius:6px}
.save{background:#16834b;color:white;width:100%}
.delete{background:#c62828;color:white}
.edit{background:#444;color:white}
.admin-item{border-bottom:1px solid #ddd;padding:12px 0}
@media(min-width:650px){.products{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>

<header>
<h1>HALVA CATALOG</h1>
<p>Выберите товары и оформите заказ</p>
</header>

<div class="container">

<button class="admin-btn" onclick="adminLogin()">Вход администратора</button>

<input class="search" id="search" placeholder="Поиск товара..." oninput="showProducts()">

<div class="products" id="products"></div>

<div class="cart">
<h2>🛒 Корзина</h2>
<div id="cart"></div>
<div class="total">Итого: <span id="total">0</span></div>
<button class="whatsapp" onclick="sendOrder()">Отправить заказ в WhatsApp</button>
</div>

<div class="panel" id="admin">
<h2>Панель администратора</h2>

<h3>Добавить или изменить товар</h3>

<input id="name" placeholder="Название товара">
<input id="price" type="number" placeholder="Цена">
<input id="photo" type="file" accept="image/*">

<button class="save" onclick="saveProduct()">Сохранить товар</button>

<h3>Список товаров</h3>
<div id="adminList"></div>

<button onclick="closeAdmin()" style="background:#ddd;margin-top:15px">Закрыть панель</button>
</div>

</div>

<script>
let products=JSON.parse(localStorage.getItem("halvaProducts")||"null") || [
{id:1,name:"Халва классическая",price:100,photo:""},
{id:2,name:"Халва с орехами",price:150,photo:""},
{id:3,name:"Халва шоколадная",price:180,photo:""}
];

let cart={};
let editId=null;
let selectedPhoto="";

function saveData(){
localStorage.setItem("halvaProducts",JSON.stringify(products));
}

function showProducts(){
let search=document.getElementById("search").value.toLowerCase();
let box=document.getElementById("products");
box.innerHTML="";

products.filter(p=>p.name.toLowerCase().includes(search)).forEach(p=>{
box.innerHTML+=`
<div class="card">
<img src="${p.photo || 'https://placehold.co/300x200?text=HALVA'}">
<h3>${p.name}</h3>
<div class="price">${p.price} ₽</div>
<button class="add" onclick="addToCart(${p.id})">Добавить в корзину</button>
</div>`;
});
}

function addToCart(id){
cart[id]=(cart[id]||0)+1;
showCart();
}

function changeQty(id,n){
cart[id]+=n;
if(cart[id]<=0) delete cart[id];
showCart();
}

function showCart(){
let box=document.getElementById("cart");
box.innerHTML="";
let total=0;

Object.keys(cart).forEach(id=>{
let p=products.find(x=>x.id==id);
if(!p)return;
let sum=p.price*cart[id];
total+=sum;

box.innerHTML+=`
<div class="cart-row">
<div>${p.name}<br>${sum} ₽</div>
<div class="qty">
<button onclick="changeQty(${id},-1)">−</button>
${cart[id]}
<button onclick="changeQty(${id},1)">+</button>
</div>
</div>`;
});

document.getElementById("total").innerText=total+" ₽";
}

function sendOrder(){
let lines=[];
let total=0;

Object.keys(cart).forEach(id=>{
let p=products.find(x=>x.id==id);
if(!p)return;
let sum=p.price*cart[id];
total+=sum;
lines.push(p.name+" × "+cart[id]+" = "+sum+" ₽");
});

if(!lines.length){
alert("Корзина пустая");
return;
}

let phone=prompt("Введите номер WhatsApp с кодом страны, только цифры:");
if(!phone)return;

let message="Здравствуйте! Мой заказ:\n"+
lines.join("\n")+
"\nИтого: "+total+" ₽";

window.open("https://wa.me/"+phone+"?text="+encodeURIComponent(message),"_blank");
}

function adminLogin(){
let pass=prompt("Введите пароль администратора:");
if(pass==="1234"){
document.getElementById("admin").style.display="block";
showAdmin();
}else{
alert("Неверный пароль");
}
}

function closeAdmin(){
document.getElementById("admin").style.display="none";
}

document.getElementById("photo").addEventListener("change",function(e){
let file=e.target.files[0];
if(!file)return;
let reader=new FileReader();
reader.onload=function(){
selectedPhoto=reader.result;
};
reader.readAsDataURL(file);
});

function saveProduct(){
let name=document.getElementById("name").value.trim();
let price=Number(document.getElementById("price").value);

if(!name||price<0||document.getElementById("price").value===""){
alert("Заполните название и цену");
return;
}

if(editId!==null){
let p=products.find(x=>x.id===editId);
p.name=name;
p.price=price;
if(selectedPhoto)p.photo=selectedPhoto;
}else{
products.push({
id:Date.now(),
name:name,
price:price,
photo:selectedPhoto
});
}

saveData();
editId=null;
selectedPhoto="";
document.getElementById("name").value="";
document.getElementById("price").value="";
document.getElementById("photo").value="";
showProducts();
showAdmin();
alert("Товар сохранён");
}

function showAdmin(){
let box=document.getElementById("adminList");
box.innerHTML="";

products.forEach(p=>{
box.innerHTML+=`
<div class="admin-item">
<b>${p.name}</b> — ${p.price} ₽<br><br>
<button class="edit" onclick="editProduct(${p.id})">Изменить</button>
<button class="delete" onclick="deleteProduct(${p.id})">Удалить</button>
</div>`;
});
}

function editProduct(id){
let p=products.find(x=>x.id===id);
editId=id;
selectedPhoto="";
document.getElementById("name").value=p.name;
document.getElementById("price").value=p.price;
document.getElementById("photo").value="";
}

function deleteProduct(id){
if(!confirm("Удалить этот товар?"))return;
products=products.filter(p=>p.id!==id);
delete cart[id];
saveData();
showProducts();
showCart();
showAdmin();
}

showProducts();
showCart();
</script>

</body>
</html>
